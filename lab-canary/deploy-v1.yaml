apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet-v1
  namespace: lab-canary
  labels:
    app: intranet
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: intranet
      version: v1
  template:
    metadata:
      labels:
        app: intranet      # label COMMUN -> cible par le Service (canary)
        version: v1        # label specifique a la version
    spec:
      containers:
        - name: intranet
          image: aichalo/intranet-newdeal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
