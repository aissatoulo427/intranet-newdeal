apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet-v2
  namespace: lab-canary
  labels:
    app: intranet
    version: v2
spec:
  replicas: 0            # demarre a 0 : aucun trafic vers v2 au depart
  selector:
    matchLabels:
      app: intranet
      version: v2
  template:
    metadata:
      labels:
        app: intranet    # label COMMUN -> cible par le meme Service que v1
        version: v2      # label specifique a la version
    spec:
      containers:
        - name: intranet
          image: aichalo/intranet-newdeal:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
