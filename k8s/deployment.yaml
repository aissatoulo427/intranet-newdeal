apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet-newdeal
  namespace: default
  labels:
    app: intranet-newdeal
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intranet-newdeal
  template:
    metadata:
      labels:
        app: intranet-newdeal
    spec:
      containers:
        - name: intranet-newdeal
          image: aichalo/intranet-newdeal:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
