name: CD Pipeline - Deploy to Production

on:
  push:
    branches:
      - prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  CONTAINER_NAME: intranet-newdeal-prod

jobs:
  # Job 1 : Scan de sécurité avant déploiement
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull de l'image depuis Docker Hub
        run: docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2 : Déploiement sur le runner de production (port 80)
  deploy:
    name: Deploy to Production
    runs-on: runner_prod
    needs: security-scan
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull de la dernière image
        run: docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Arrêter et supprimer l'ancien conteneur si existant
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

      - name: Déployer le nouveau conteneur sur le port 80
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p 80:80 \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Vérifier que le conteneur est bien démarré
        run: |
          sleep 5
          docker ps | grep ${{ env.CONTAINER_NAME }}
          echo "Déploiement réussi - Application accessible sur le port 80"
