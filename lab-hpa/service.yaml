# Service manquant dans le PDF : indispensable pour exposer webapp
# et pouvoir faire le port-forward vers le port 8087 utilise par K6.
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: lab-hpa
  labels:
    app: webapp
spec:
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
